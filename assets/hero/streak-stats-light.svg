<stop offset="0" stop-color="#F8FBFF"/>
<stop offset="1" stop-color="#F5F3FF"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="720" height="200" rx="14" fill="url(#bg)" stroke="#E2E8F0"/>
<rect x="12" y="12" width="696" height="176" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="26" y="30" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.5" fill="#0891B2">STREAK.STATS</text>

    <text x="120" y="86" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="bold" fill="#172554">169</text>
