name: Update streak stats and top languages

on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate streak stats
        run: node scripts/generate-streak-stats.mjs

      - name: Regenerate top languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-top-languages.mjs

      - name: Commit changes
        run: |
          if git diff --quiet assets/hero/streak-stats-dark.svg assets/hero/streak-stats-light.svg assets/hero/top-languages-dark.svg assets/hero/top-languages-light.svg; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero/streak-stats-dark.svg assets/hero/streak-stats-light.svg assets/hero/top-languages-dark.svg assets/hero/top-languages-light.svg
          git commit -m "chore: update streak stats and top languages"
          git push
