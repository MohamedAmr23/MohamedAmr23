name: Generate contribution snake

on:
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs (signal palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=%2338BDF8&color_dots=%230B1424,%23164E63,%230E7490,%2322D3EE,%237C3AED
            dist/github-snake-light.svg?color_snake=%232563EB&color_dots=%23E7ECF5,%23BFE3EE,%237DD3E8,%230891B2,%236D28D9

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
