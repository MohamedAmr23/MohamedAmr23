name: Update contribution trail

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.event.repository.name == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate contribution trail
        run: node scripts/generate-contribution-trail.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero/contribution-trail-dark.svg assets/hero/contribution-trail-light.svg

          if git diff --cached --quiet; then
            echo "No contribution trail changes to commit."
            exit 0
          fi

          git commit -m "chore: update contribution trail"
          git push
